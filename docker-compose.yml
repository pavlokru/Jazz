services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: jazzcatalog_app
    restart: always
    working_dir: /workspace
    # Este comando mantiene la app viva y en ejecución
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.fileWatcherType=auto
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s